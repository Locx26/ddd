<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureTrust Bank - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md">
    <div class="text-center mb-10">
      <h1 class="text-5xl font-bold text-white mb-2">SecureTrust</h1>
      <p class="text-blue-200">Enterprise Banking Platform</p>
    </div>
    <div class="bg-white/10 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/20 p-8">
      <h2 class="text-2xl font-semibold text-white mb-8 text-center">Welcome Back</h2>
      <form th:action="@{/login}" method="post" class="space-y-6">
        <input type="email" name="email" placeholder="admin@securetrust.com" required
               class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 text-white placeholder-blue-200 focus:outline-none focus:ring-2 focus:ring-cyan-500">
        <input type="password" name="password" placeholder="••••••••" required
               class="w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 text-white placeholder-blue-200 focus:outline-none focus:ring-2 focus:ring-cyan-500">
        <button type="submit" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-semibold rounded-lg shadow-lg hover:shadow-cyan-500/50 transform hover:scale-105 transition">
          Sign In Securely
        </button>
      </form>
      <p class="text-red-400 text-center mt-4" th:text="${error}"></p>
    </div>
  </div>
</body>
</html>
