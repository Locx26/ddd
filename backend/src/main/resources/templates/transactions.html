<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureTrust - Transactions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-gray-50">
  <!-- Sidebar -->
  <div class="fixed inset-y-0 left-0 w-64 bg-gradient-to-b from-slate-900 to-slate-800 text-white">
    <div class="p-6">
      <h1 class="text-2xl font-bold">SecureTrust</h1>
      <p class="text-xs text-gray-400">Banking System</p>
    </div>
    <nav class="mt-8">
      <a href="/dashboard" class="block py-3 px-6 hover:bg-cyan-600/10 font-medium">
        <span class="mr-2">📊</span> Dashboard
      </a>
      <a href="/customers" class="block py-3 px-6 hover:bg-cyan-600/10 font-medium">
        <span class="mr-2">👥</span> Customers
      </a>
      <a href="/transactions" class="block py-3 px-6 bg-cyan-600/20 border-l-4 border-cyan-500 font-medium">
        <span class="mr-2">💳</span> Transactions
      </a>
      <a href="/logout" class="block py-3 px-6 hover:bg-red-600/10 font-medium mt-8">
        <span class="mr-2">🚪</span> Logout
      </a>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="ml-64 p-8">
    <h2 class="text-4xl font-bold text-gray-800 mb-8">Banking Transactions</h2>

    <!-- Success/Error Messages -->
    <div th:if="${successMessage}" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6 rounded">
      <p th:text="${successMessage}"></p>
    </div>
    <div th:if="${errorMessage}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded">
      <p th:text="${errorMessage}"></p>
    </div>

    <!-- Transaction Forms -->
    <div class="grid grid-cols-3 gap-6 mb-8">
      <!-- Deposit Form -->
      <div class="bg-white rounded-xl shadow-lg p-6">
        <h3 class="text-xl font-semibold mb-4 text-green-600 flex items-center">
          <span class="mr-2">💵</span> Deposit
        </h3>
        <form th:action="@{/transactions/deposit}" method="post" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Account</label>
            <select name="accountNumber" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
              <option value="">Select Account</option>
              <option th:each="acc : ${accounts}" th:value="${acc.accountNumber}" 
                      th:text="${acc.accountNumber + ' - ' + acc.accountType.displayName + ' ($' + #numbers.formatDecimal(acc.balance,1,2,'COMMA') + ')'}">
              </option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Amount</label>
            <input type="number" name="amount" step="0.01" min="0.01" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                   placeholder="0.00">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Description (Optional)</label>
            <input type="text" name="description" 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
                   placeholder="e.g., Salary deposit">
          </div>
          <button type="submit" class="w-full py-3 bg-green-500 text-white font-semibold rounded-lg hover:bg-green-600 transition">
            Deposit Funds
          </button>
        </form>
      </div>

      <!-- Withdrawal Form -->
      <div class="bg-white rounded-xl shadow-lg p-6">
        <h3 class="text-xl font-semibold mb-4 text-red-600 flex items-center">
          <span class="mr-2">💰</span> Withdraw
        </h3>
        <form th:action="@{/transactions/withdraw}" method="post" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Account</label>
            <select name="accountNumber" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent">
              <option value="">Select Account</option>
              <option th:each="acc : ${accounts}" th:value="${acc.accountNumber}" 
                      th:text="${acc.accountNumber + ' - ' + acc.accountType.displayName + ' ($' + #numbers.formatDecimal(acc.balance,1,2,'COMMA') + ')'}">
              </option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Amount</label>
            <input type="number" name="amount" step="0.01" min="0.01" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                   placeholder="0.00">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Description (Optional)</label>
            <input type="text" name="description" 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                   placeholder="e.g., Cash withdrawal">
          </div>
          <button type="submit" class="w-full py-3 bg-red-500 text-white font-semibold rounded-lg hover:bg-red-600 transition">
            Withdraw Funds
          </button>
        </form>
      </div>

      <!-- Transfer Form -->
      <div class="bg-white rounded-xl shadow-lg p-6">
        <h3 class="text-xl font-semibold mb-4 text-blue-600 flex items-center">
          <span class="mr-2">🔄</span> Transfer
        </h3>
        <form th:action="@{/transactions/transfer}" method="post" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">From Account</label>
            <select name="fromAccount" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="">Select Account</option>
              <option th:each="acc : ${accounts}" th:value="${acc.accountNumber}" 
                      th:text="${acc.accountNumber + ' - ' + acc.accountType.displayName + ' ($' + #numbers.formatDecimal(acc.balance,1,2,'COMMA') + ')'}">
              </option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">To Account</label>
            <select name="toAccount" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="">Select Account</option>
              <option th:each="acc : ${accounts}" th:value="${acc.accountNumber}" 
                      th:text="${acc.accountNumber + ' - ' + acc.accountType.displayName}">
              </option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Amount</label>
            <input type="number" name="amount" step="0.01" min="0.01" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="0.00">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Description (Optional)</label>
            <input type="text" name="description" 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="e.g., Fund transfer">
          </div>
          <button type="submit" class="w-full py-3 bg-blue-500 text-white font-semibold rounded-lg hover:bg-blue-600 transition">
            Transfer Funds
          </button>
        </form>
      </div>
    </div>

    <!-- Recent Transactions Table -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      <div class="px-6 py-4 bg-gray-50 border-b">
        <h3 class="text-xl font-semibold text-gray-800">Recent Transactions</h3>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
              <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
              <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase">Account</th>
              <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase">Description</th>
              <th class="px-6 py-4 text-right text-xs font-medium text-gray-500 uppercase">Amount</th>
              <th class="px-6 py-4 text-right text-xs font-medium text-gray-500 uppercase">Balance After</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <tr th:if="${#lists.isEmpty(transactions)}" class="text-center">
              <td colspan="6" class="px-6 py-8 text-gray-500">No transactions found</td>
            </tr>
            <tr th:each="txn : ${transactions}" class="hover:bg-gray-50">
              <td class="px-6 py-4 text-sm text-gray-600" th:text="${#temporals.format(txn.transactionDate, 'MMM dd, yyyy HH:mm')}">Jan 01, 2025 10:00</td>
              <td class="px-6 py-4">
                <span class="px-3 py-1 text-xs font-semibold rounded-full"
                      th:classappend="${txn.type.name() == 'DEPOSIT' || txn.type.name() == 'TRANSFER_IN'} ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
                      th:text="${txn.type.displayName}">Deposit</span>
              </td>
              <td class="px-6 py-4 text-sm font-medium text-gray-900" th:text="${txn.account.accountNumber}">SAV001</td>
              <td class="px-6 py-4 text-sm text-gray-600" th:text="${txn.description}">Description</td>
              <td class="px-6 py-4 text-sm text-right font-bold"
                  th:classappend="${txn.type.name() == 'DEPOSIT' || txn.type.name() == 'TRANSFER_IN'} ? 'text-green-600' : 'text-red-600'">
                <span th:text="${txn.type.name() == 'DEPOSIT' || txn.type.name() == 'TRANSFER_IN' ? '+' : '-'} + '$' + ${#numbers.formatDecimal(txn.amount,1,2,'COMMA')}">+$1,000.00</span>
              </td>
              <td class="px-6 py-4 text-sm text-right text-gray-900 font-medium">
                $<span th:text="${#numbers.formatDecimal(txn.balanceAfter,1,2,'COMMA')}">5,000.00</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script th:src="@{/js/app.js}"></script>
</body>
</html>
