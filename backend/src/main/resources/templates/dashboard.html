<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureTrust - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-gray-50">
  <div class="fixed inset-y-0 left-0 w-64 bg-gradient-to-b from-slate-900 to-slate-800 text-white">
    <div class="p-6"><h1 class="text-2xl font-bold">SecureTrust</h1></div>
    <nav class="mt-8">
      <a href="#" class="block py-3 px-6 bg-cyan-600/20 border-l-4 border-cyan-500 font-medium">Dashboard</a>
    </nav>
  </div>

  <div class="ml-64 p-8">
    <h2 class="text-4xl font-bold text-gray-800 mb-8">Banking Dashboard</h2>

    <div class="grid grid-cols-4 gap-6 mb-8">
      <div class="bg-white rounded-xl shadow-lg p-6">
        <p class="text-sm text-gray-600">Total Customers</p>
        <p class="text-3xl font-bold" th:text="${#lists.size(customers)}">0</p>
      </div>
      <div class="bg-white rounded-xl shadow-lg p-6">
        <p class="text-sm text-gray-600">Total Balance</p>
        <p class="text-3xl font-bold">$<span th:text="${#numbers.formatDecimal(totalBalance,1,2,'COMMA')}">0</span></p>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
      <canvas id="balanceChart" height="100"></canvas>
    </div>

    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      <div class="px-6 py-4 bg-gray-50"><h3 class="text-xl font-semibold">Customers</h3></div>
      <table class="w-full">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
            <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
            <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase">Balance</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="c : ${customers}">
            <td class="px-6 py-4" th:text="${c.name}"></td>
            <td class="px-6 py-4" th:text="${c.email}"></td>
            <td class="px-6 py-4 font-bold" th:text="${#aggregates.sum(c.accounts.![balance])}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script th:src="@{/js/app.js}"></script>
  <script th:inline="javascript">
    /*<![CDATA[*/
    const balances = /*[[${balances}]]*/ [];
    new Chart(document.getElementById('balanceChart'), {
      type: 'doughnut',
      data: { datasets: [{ data: balances, backgroundColor: ['#06b6d4', '#3b82f6', '#8b5cf6'] }] },
      options: { responsive: true, cutout: '65%' }
    });
    /*]]>*/
  </script>
</body>
</html>
